name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test (Node ${{ matrix.node-version }} on ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests with coverage
        run: npx vitest run --coverage

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  prepare-build:
    name: Prepare build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: OpenCode recall E2E
        run: npx vitest run --config vitest.e2e.config.ts src/__tests__/e2e/opencode-recall.test.ts

      # Needs no network or secrets: a fake `gh` on PATH. Guards #711.
      - name: Unattended init E2E
        run: npx vitest run --config vitest.e2e.config.ts src/__tests__/e2e/init-unattended.test.ts

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Keep the existing Build check gated on the unit matrix while E2E can
  # consume the prepared artifact as soon as it is available.
  build:
    name: Build
    needs: [lint-and-test, prepare-build]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm build and unit matrix passed
        run: echo "Build and unit test matrix passed."

  fork-e2e:
    name: E2E (fork-safe, no credentials)
    needs: prepare-build
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Fork code is untrusted. Never expose repository secrets to this job.
      # Remote-provider cases skip themselves when credentials are absent.
      # The e2e setup file (src/__tests__/helpers/isolate-e2e-env.ts) gives each
      # test file a sandbox HOME with its own git identity.
      - name: Run E2E (no remote credentials)
        run: npx vitest run --config vitest.e2e.config.ts

  e2e:
    name: E2E (GitHub provider, full surface)
    needs: prepare-build
    if: ${{ vars.TEAMAI_TEST_REPO_URL != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    # E2E shares one fixture repo. Serialize across all branches/PRs so
    # concurrent runs don't trample each other's state. Don't cancel
    # in-progress jobs — let them finish to leave the fixture clean.
    concurrency:
      group: e2e-fixture-repo
      cancel-in-progress: false
    # Fork PRs run the credential-free job above. Never expose the fixture
    # token to code from a fork.
    env:
      TEAMAI_TEST_PROVIDER: github
      TEAMAI_TEST_REPO_URL: ${{ vars.TEAMAI_TEST_REPO_URL }}
      TEAMAI_TEST_TOKEN: ${{ secrets.TEAMAI_TEST_TOKEN }}
      # The CLI's GitHub provider auto-picks up GITHUB_TOKEN for auth.
      GITHUB_TOKEN: ${{ secrets.TEAMAI_TEST_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # Each test file runs in a sandbox HOME with its own git identity
      # (src/__tests__/helpers/isolate-e2e-env.ts); the remote cases clone the
      # fixture repo into it themselves (prepareRemoteTeamHome in e2e.test.ts).
      - name: Run E2E (full surface)
        run: npx vitest run --config vitest.e2e.config.ts --reporter=verbose
